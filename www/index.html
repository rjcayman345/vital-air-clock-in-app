<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2e57">
<title>Vital Air Time Clock</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap" id="wrap">
  <div class="brand">
    <div class="plate"><img alt="Vital Air — Air Conditioning, Geothermal Experts" src="logo.jpg"></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-clock" aria-selected="true">Clock</button>
      <button role="tab" id="tab-hours" aria-selected="false">Hours</button>
    </div>
  </div>
  <div id="banner" class="note" hidden></div>
  <main id="view"></main>
</div>
<script src="config.js"></script>
<script src="vendor/firebase-app-compat.js"></script>
<script src="vendor/firebase-auth-compat.js"></script>
<script src="vendor/firebase-firestore-compat.js"></script>
<script src="jobs.js"></script>
<script src="app.js"></script>
</body>
</html>
